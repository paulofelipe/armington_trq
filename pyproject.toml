[project]
name = "armington-trq"
version = "0.1.0"
description = "Armington model with tariff rate quotas (trq)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
